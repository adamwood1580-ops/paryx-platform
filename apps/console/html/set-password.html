<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#022D1D" />

    <title>Paryx Console | Reset Password</title>

    <link
        rel="stylesheet"
        href="../../club/styles/tokens.css"
    />
    <link
        rel="stylesheet"
        href="../styles/console-auth.css"
    />

    <link
        rel="apple-touch-icon"
        href="../../club/assets/paryx-apple-touch-icon.png"
    />
    <link
        rel="icon"
        type="image/png"
        href="../../club/assets/paryx-favicon.png"
    />
</head>

<body>
    <main class="console-login-card">
        <header class="console-login-brand">
            <img
                src="../../club/assets/branding/paryx-logo.png"
                alt="Paryx"
            />
            <strong>Paryx Console</strong>
            <span>Reset your global Paryx password</span>
        </header>

        <form
            id="consoleSetPasswordForm"
            class="console-login-form"
            novalidate
        >
            <input
                id="consoleNewPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="New password — at least 8 characters"
                required
            />

            <input
                id="consoleConfirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Confirm new password"
                required
            />

            <button
                id="consoleSetPasswordButton"
                type="submit"
                disabled
            >
                Verify reset link
            </button>

            <p
                id="consoleSetPasswordMessage"
                class="console-login-message"
                role="status"
                aria-live="polite"
                hidden
            ></p>
        </form>

        <footer class="console-login-footer">
            <a href="login.html">
                Back to Console sign in
            </a>
        </footer>
    </main>

    <script src="../../club/js/core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../club/js/core/supabase.js"></script>
    <script src="../js/auth/set-password.js?auth=0.3.5"></script>
</body>
</html>
