<!DOCTYPE html>
<html lang="en" class="auth-protected">
<head>
    <style>
        html.auth-protected {
            min-height: 100%;
            background: #06382a !important;
        }

        html.auth-protected body {
            min-height: 100%;
            margin: 0;
        }

        html.auth-protected:not(.auth-ready) body {
            visibility: hidden;
            background: #06382a !important;
        }

        html.auth-protected.auth-ready,
        html.auth-protected.auth-ready body {
            background: #f4f6f3 !important;
        }
    </style>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="theme-color"
        content="#06382a"
    />

    <title>Members | ClubHub</title>

    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/app-shell.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/admin.css" />
    <link rel="stylesheet" href="../styles/admin-members.css" />

    <link
        rel="manifest"
        href="../json/manifest.json"
    />

    <link
        rel="apple-touch-icon"
        href="../assets/app.PNG"
    />

    <meta
        name="apple-mobile-web-app-title"
        content="ClubHub"
    />

    <meta
        name="application-name"
        content="ClubHub"
    />

    <script
        src="../js/core/protected-loader.js?loader=13"
        data-scripts="../js/pages/admin-members-page.js"
        defer
    ></script>

    <script
        src="../js/pages/admin-members-privacy.js?v=0.24.2"
        defer
    ></script>
</head>

<body
    data-page="adminmembers"
    data-header="standard"
    data-title="Members"
>
    <div class="app-shell">
        <header data-app-header></header>

        <main class="app-main admin-page admin-members-page">
            <a
                href="admin.html"
                class="admin-back-link"
            >
                <span aria-hidden="true">←</span>
                Admin
            </a>

            <section class="admin-members-intro">
                <div>
                    <p class="page-heading__eyebrow">
                        Member management
                    </p>

                    <h1 class="admin-members-intro__title">
                        Members
                    </h1>

                    <p
                        id="memberClubName"
                        class="admin-members-intro__subtitle"
                    >
                        Loading club information...
                    </p>
                </div>

                <a
                    href="admin-import-members.html"
                    class="admin-primary-action"
                >
                    Import CSV
                </a>
            </section>

            <section
                id="membersError"
                class="admin-error"
                role="alert"
                hidden
            ></section>

            <section class="card admin-member-toolbar">
                <label class="admin-member-search">
                    <span class="admin-member-field-label">
                        Search members
                    </span>

                    <input
                        id="memberSearch"
                        type="search"
                        placeholder="Name, email or member number"
                        autocomplete="off"
                    />
                </label>

                <label class="admin-member-filter">
                    <span class="admin-member-field-label">
                        Status
                    </span>

                    <select id="memberStatusFilter">
                        <option value="all">All statuses</option>
                        <option value="active">Active</option>
                        <option value="invited">Invited</option>
                        <option value="pending">Pending</option>
                        <option value="suspended">Suspended</option>
                        <option value="expired">Expired</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </label>
            </section>

            <section class="admin-member-summary">
                <div>
                    <span class="admin-member-summary__label">
                        Results
                    </span>

                    <strong
                        id="memberResultCount"
                        class="admin-member-summary__value"
                    >
                        --
                    </strong>
                </div>

                <button
                    id="memberRefreshBtn"
                    class="admin-secondary-button"
                    type="button"
                >
                    Refresh
                </button>
            </section>

            <section
                id="memberList"
                class="admin-member-list"
                aria-live="polite"
            >
                <div class="admin-member-loading">
                    Loading members...
                </div>
            </section>

            <button
                id="loadMoreMembersBtn"
                class="admin-load-more"
                type="button"
                hidden
            >
                Load more members
            </button>
        </main>
    </div>
</body>
</html>
