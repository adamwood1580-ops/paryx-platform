<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    html,
    body {
        min-height: 100%;
        margin: 0;
        background: #064831;
    }
</style>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="theme-color"
        content="#064831"
    />

    <title>Sign In | Paryx</title>

    <link
        rel="stylesheet"
        href="../styles/tokens.css"
    />

    <link
        rel="stylesheet"
        href="../styles/components.css"
    />

    <link
    rel="stylesheet"
    href="../styles/auth.css?brand=10"
/>

    <link
        rel="manifest"
        href="../json/manifest.json"
    />

    <link
        rel="apple-touch-icon"
        href="../assets/paryx-apple-touch-icon.png"
    />

    <link rel="icon" type="image/png" href="../assets/paryx-favicon.png" />
</head>

<body class="auth-page">
    <main class="auth-layout">
        <section
            class="auth-panel"
            aria-label="Paryx staff sign in"
        >
            <!-- =============================================
                 PARYX BRAND
                 ============================================= -->

            <header class="auth-brand">
                <img
                    src="../assets/branding/paryx-logo.png?brand=1"
                    alt="Paryx — The platform behind your club."
                    class="paryx-logo"
                />

                <p class="auth-tagline">
                    <span>Secure staff access.</span>
                </p>
            </header>

            <!-- =============================================
                 LOGIN FORM
                 ============================================= -->

            <form
                id="loginForm"
                class="auth-form"
                novalidate
            >
                <div class="auth-fields">
                    <div class="auth-field">
                        <label
                            class="visually-hidden"
                            for="email"
                        >
                            Email address
                        </label>

                        <span
                            class="auth-field__icon"
                            aria-hidden="true"
                        >
                            <svg viewBox="0 0 24 24">
                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                />

                                <path
                                    d="m4 7 8 6 8-6"
                                />
                            </svg>
                        </span>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            inputmode="email"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            placeholder="Email address"
                            required
                        />
                    </div>

                    <div class="auth-field">
                        <label
                            class="visually-hidden"
                            for="password"
                        >
                            Password
                        </label>

                        <span
                            class="auth-field__icon"
                            aria-hidden="true"
                        >
                            <svg viewBox="0 0 24 24">
                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2"
                                />

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                />
                            </svg>
                        </span>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Password"
                            required
                        />

                        <button
                            id="passwordToggle"
                            class="auth-field__toggle"
                            type="button"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg
                                class="password-eye password-eye--show"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="
                                        M2 12
                                        C4.8 7.8 8.1 6 12 6
                                        C15.9 6 19.2 7.8 22 12
                                        C19.2 16.2 15.9 18 12 18
                                        C8.1 18 4.8 16.2 2 12Z
                                    "
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />
                            </svg>
                        </button>
                    </div>

                    <button
                        id="loginButton"
                        class="auth-submit"
                        type="submit"
                    >
                        <span class="auth-submit__label">
                            Sign In
                        </span>

                        <span
                            class="auth-submit__spinner"
                            aria-hidden="true"
                        ></span>
                    </button>
                </div>

                <p
                    id="loginMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>
            </form>

            <!-- =============================================
                 SECONDARY ACTIONS
                 ============================================= -->

            <footer class="auth-footer">
                <a
                    class="auth-link auth-link--password"
                    href="#"
                >
                    Password reset coming soon
                </a>

                <p class="auth-club-contact">
                    Need access?

                    <a href="mailto:">
                        Contact your Paryx administrator.
                    </a>
                </p>
            </footer>
        </section>
    </main>

    <script src="../js/core/config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/core/supabase.js"></script>

    <script src="../js/auth/login.js?login=1"></script>
</body>
</html>
