<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#064831">
    <title>Club Credit | Paryx</title>
    <link rel="stylesheet" href="../styles/member.css">
    <link rel="manifest" href="../json/manifest.json">
    <link rel="apple-touch-icon" href="../assets/paryx-apple-touch-icon.png">
</head>
<body data-page="profile">
    <main class="member-app">
        <header class="topbar">
            <div class="brand">
                <img src="../assets/branding/paryx-mark.png" alt="">
                <strong>Club Credit</strong>
            </div>
            <a class="link-btn" href="clubs.html">My clubs</a>
        </header>

        <section class="hero">
            <p class="eyebrow">Member benefits</p>
            <h1 class="title">Your club balances</h1>
            <p class="subtitle">Club Credit belongs to each club separately and follows your club membership.</p>
        </section>

        <div id="creditMessage" class="notice" hidden></div>

        <section class="section">
            <div class="section-head">
                <div>
                    <h2>Balances</h2>
                    <p id="creditAccountCount" class="profile-section-meta">Loading…</p>
                </div>
            </div>
            <div id="creditAccounts" class="credit-page-accounts">
                <div class="empty">Loading Club Credit…</div>
            </div>
        </section>

        <section id="creditActivitySection" class="section" hidden>
            <div class="section-head">
                <div>
                    <h2 id="creditActivityTitle">Activity</h2>
                    <p class="profile-section-meta">Most recent transactions</p>
                </div>
            </div>
            <div id="creditActivity" class="profile-credit-transactions"></div>
        </section>
    </main>

    <div data-member-shell></div>

    <script src="../js/core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/supabase.js"></script>
    <script src="../js/core/member-core.js"></script>
    <script src="../js/core/member-shell.js"></script>
    <script src="../js/pages/credit-page.js?v=0.26.0"></script>
</body>
</html>
