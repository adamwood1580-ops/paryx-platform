<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#064831">
    <title>Notifications | Paryx</title>
    <link rel="stylesheet" href="../styles/member.css?v=0.28.0">
    <link rel="manifest" href="../json/manifest.json">
    <link rel="apple-touch-icon" href="../assets/paryx-apple-touch-icon.png">
</head>
<body data-page="notifications">
    <main class="member-app">
        <header class="topbar">
            <div class="brand">
                <img src="../assets/branding/paryx-mark.png" alt="">
                <strong>Notifications</strong>
            </div>
            <button id="markAllRead" class="link-btn" type="button">Mark all read</button>
        </header>

        <section class="hero">
            <p class="eyebrow">Player alerts</p>
            <h1 class="title">Stay on top of your golf</h1>
            <p class="subtitle">Booking updates and tee-time availability alerts appear here.</p>
        </section>

        <div id="notificationMessage" class="notice" hidden></div>

        <section class="section">
            <div class="section-head">
                <div>
                    <h2>Notifications</h2>
                    <p id="notificationCount" class="profile-section-meta">Loading…</p>
                </div>
            </div>
            <div id="notificationList" class="notification-list">
                <div class="empty">Loading notifications…</div>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div>
                    <h2>Tee-time alerts</h2>
                    <p class="profile-section-meta">One-shot alerts for exact tee times you are watching.</p>
                </div>
                <a href="booking.html">Find times</a>
            </div>
            <div id="alertList" class="tee-alert-list">
                <div class="empty">Loading tee-time alerts…</div>
            </div>
        </section>
    </main>

    <div data-member-shell></div>

    <script src="../js/core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/supabase.js"></script>
    <script src="../js/core/member-core.js"></script>
    <script src="../js/core/member-shell.js?v=0.28.0"></script>
    <script src="../js/pages/notifications-page.js?v=0.28.0"></script>
</body>
</html>
