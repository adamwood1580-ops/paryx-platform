<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064831"><title>Book | Paryx</title><link rel="stylesheet" href="../styles/member.css"><link rel="manifest" href="../json/manifest.json"></head><body data-page="book"><main class="member-app"><header class="topbar"><div class="brand"><img src="../assets/branding/paryx-mark.png" alt=""><strong>Book</strong></div><button id="openClubPicker" class="link-btn" type="button">Change club</button></header><section class="hero"><p class="eyebrow">Tee booking</p><h1 id="clubName" class="title">Choose a club</h1><p id="clubMeta" class="subtitle">Book at any club using Paryx.</p></section><section id="accessBanner" class="notice" hidden><strong>Are you a member here?</strong><div>Link your Paryx account to unlock this club's member calendar.</div><button id="requestAccess" class="link-btn" type="button">Contact club for member access</button></section><section class="section"><label class="field"><span>Course</span><select id="courseSelect"></select></label></section><section class="section"><div id="dateStrip" class="date-strip"></div></section><section class="section"><div class="section-head"><h2 id="teeHeading">Tee times</h2></div><div id="message" class="notice" hidden></div><div id="teeTimes" class="tee-list"></div></section><section id="my-bookings" class="section"><div class="section-head"><h2>My bookings</h2></div><div id="bookings"></div></section></main><div data-member-shell></div>
<dialog id="clubDialog" class="dialog"><div class="dialog-panel"><div class="dialog-head"><div><h2>Choose club</h2><p>Free players can book at any Paryx club.</p></div><button id="closeClubDialog" class="close" type="button">×</button></div><label class="field"><span>Search clubs</span><input id="clubSearch" type="search" placeholder="Club or town"></label><div id="clubResults" class="club-list" style="margin-top:12px"></div></div></dialog>
<dialog id="bookingDialog" class="dialog"><form id="bookingForm" class="dialog-panel"><div class="dialog-head"><div><h2 id="bookingTitle">Book tee time</h2><p id="bookingMeta"></p></div><button id="closeBookingDialog" class="close" type="button">×</button></div><input id="actionId" type="hidden"><input id="actionType" type="hidden"><div class="stack"><label class="field"><span>Players in your party</span><select id="partySize"></select></label><label id="bookingTypeField" class="field"><span>Booking type</span><select id="bookingType"><option value="joinable">Joinable</option><option value="private">Private</option></select></label></div><div class="dialog-actions"><button id="backBooking" class="button secondary" type="button">Back</button><button id="confirmBooking" class="button" type="submit">Confirm</button></div></form></dialog>
<dialog id="accessDialog" class="dialog"><form id="accessForm" class="dialog-panel"><div class="dialog-head"><div><h2>Member access</h2><p id="accessClubName"></p></div><button id="closeAccessDialog" class="close" type="button">×</button></div><div class="stack"><label class="field"><span>Membership number</span><input id="membershipNumber" placeholder="If known"></label><label class="field"><span>Message to club</span><textarea id="accessMessage" placeholder="Optional"></textarea></label></div><div class="dialog-actions"><button id="backAccess" class="button secondary" type="button">Back</button><button class="button" type="submit">Send request</button></div></form></dialog>
<script src="../js/core/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/core/supabase.js"></script><script src="../js/core/member-core.js"></script><script src="../js/core/member-shell.js"></script><script src="../js/pages/booking-page.js"></script></body></html>
