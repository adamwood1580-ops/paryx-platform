<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <meta name="theme-color" content="#064831">
    <title>Set Paryx Password</title>
    <link rel="stylesheet" href="../styles/member.css">
    <link rel="manifest" href="../json/manifest.json">
    <link rel="apple-touch-icon" href="../assets/paryx-apple-touch-icon.png">
    <link rel="icon" href="../assets/paryx-favicon.png">
</head>
<body class="auth-page">
    <main class="auth-panel">
        <img
            class="auth-logo"
            src="../assets/branding/paryx-logo.png"
            alt="Paryx"
        >

        <p class="auth-tag">
            One account. Every Paryx club.
        </p>

        <div style="margin-bottom:18px">
            <p
                id="setPasswordEyebrow"
                class="eyebrow"
            >
                Paryx account
            </p>
            <h1 class="title" style="font-size:1.65rem">
                Set your password
            </h1>
            <p
                id="setPasswordSubtitle"
                class="subtitle"
            >
                Choose a secure password for your Paryx account.
            </p>
        </div>

        <form
            id="memberSetPasswordForm"
            class="stack"
            novalidate
        >
            <label class="field">
                <span>New password</span>
                <input
                    id="newPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </label>

            <label class="field">
                <span>Confirm password</span>
                <input
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </label>

            <p
                id="setPasswordMessage"
                class="notice"
                role="status"
                aria-live="polite"
                hidden
            ></p>

            <button
                id="setPasswordButton"
                class="button full"
                type="submit"
                disabled
            >
                Activate Paryx account
            </button>
        </form>
    </main>

    <script src="../js/core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/supabase.js"></script>
    <script src="../js/auth/member-set-password.js?v=0.13.1"></script>
</body>
</html>
