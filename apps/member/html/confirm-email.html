<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <meta name="theme-color" content="#064831">
    <title>Confirm Paryx Email</title>

    <link
        rel="stylesheet"
        href="../styles/member.css"
    >
</head>

<body class="auth-page">
    <main class="auth-panel">
        <img
            class="auth-logo"
            src="../assets/branding/paryx-logo.png"
            alt="Paryx"
        >

        <p class="auth-tag">
            One account. Every Paryx club.
        </p>

        <div class="notice">
            <strong id="confirmEmailTitle">
                Confirming your email…
            </strong>

            <div
                id="confirmEmailMessage"
                style="margin-top:6px"
            >
                Please wait while Paryx verifies your account.
            </div>
        </div>
    </main>

    <script src="../js/core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/supabase.js"></script>
    <script src="../js/auth/member-confirm-email.js?v=0.13.1"></script>
</body>
</html>
