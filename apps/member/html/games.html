<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >
    <meta name="theme-color" content="#064831">
    <title>Find a Game | Paryx</title>

    <link
        rel="stylesheet"
        href="../styles/member.css?v=0.29.0"
    >
    <link
        rel="manifest"
        href="../json/manifest.json"
    >
</head>

<body data-page="book">
    <main class="member-app">
        <header class="topbar">
            <div class="brand">
                <img
                    src="../assets/branding/paryx-mark.png"
                    alt=""
                >
                <strong>Find a Game</strong>
            </div>

            <a class="pill" href="booking.html">Tee sheet</a>
        </header>

        <section class="hero">
            <p class="eyebrow">Play with others</p>
            <h1 class="title">Find a Game</h1>
            <p class="subtitle">
                Find joinable tee times with space for you or your group.
            </p>
        </section>

        <section class="section find-game-controls">
            <label class="field find-game-search">
                <span>Club, course or area</span>
                <input
                    id="gameSearch"
                    type="search"
                    placeholder="Search clubs or locations"
                    autocomplete="off"
                >
            </label>

            <div class="find-game-filter-grid">
                <label class="field">
                    <span>When</span>
                    <select id="gameDays">
                        <option value="7">Next 7 days</option>
                        <option value="14" selected>Next 14 days</option>
                        <option value="30">Next 30 days</option>
                    </select>
                </label>

                <label class="field">
                    <span>Places needed</span>
                    <select id="gameSpaces">
                        <option value="1">1 place</option>
                        <option value="2">2 places</option>
                        <option value="3">3 places</option>
                        <option value="4">4 places</option>
                    </select>
                </label>
            </div>

            <label class="find-game-toggle">
                <input id="gameMyClubs" type="checkbox">
                <span>Only show my member clubs</span>
            </label>
        </section>

        <section class="section">
            <div
                id="gameMessage"
                class="notice"
                hidden
                aria-live="polite"
            ></div>

            <div class="section-head">
                <h2>Joinable tee times</h2>
                <span id="gameCount" class="competition-player-count"></span>
            </div>

            <div id="gameList" class="find-game-list">
                <div class="empty">Looking for games…</div>
            </div>
        </section>
    </main>

    <dialog id="joinGameDialog" class="dialog">
        <form id="joinGameForm" class="dialog-panel">
            <div class="dialog-head">
                <div>
                    <h2>Join this game</h2>
                    <p id="joinGameMeta"></p>
                </div>
                <button
                    id="closeJoinGame"
                    class="close"
                    type="button"
                    aria-label="Close"
                >×</button>
            </div>

            <input id="joinGameBookingId" type="hidden">

            <label class="field">
                <span>Players joining</span>
                <select id="joinGameParty"></select>
            </label>

            <div class="notice">
                Player names stay private in Find a Game until you join.
            </div>

            <div class="dialog-actions">
                <button
                    id="backJoinGame"
                    class="button secondary"
                    type="button"
                >
                    Back
                </button>
                <button
                    id="confirmJoinGame"
                    class="button"
                    type="submit"
                >
                    Join game
                </button>
            </div>
        </form>
    </dialog>

    <div data-member-shell></div>

    <script src="../js/core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/supabase.js"></script>
    <script src="../js/core/member-core.js"></script>
    <script src="../js/core/member-shell.js?v=0.29.0"></script>
    <script src="../js/pages/games-page.js?v=0.29.0"></script>
</body>
</html>
